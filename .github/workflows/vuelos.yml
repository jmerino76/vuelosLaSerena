name: Actualizar Vuelos La Serena

on:
  schedule:
    - cron: '0 * * * *' # Ejecución automática cada una hora
  workflow_dispatch: # Permite ejecución manual con el botón "Run workflow"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que el bot edite tu repositorio

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4.2.2

    - name: Configurar Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Consultar API y Generar Reporte
      env:
        FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
      run: python vuelos.py

    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de estado de vuelos" && git push)
