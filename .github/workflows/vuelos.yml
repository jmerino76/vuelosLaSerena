name: Actualizar Vuelos La Serena

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (a las 00:00, 06:00, 12:00 y 18:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Mantiene activo el botón verde para pruebas manuales

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4.2.2

    - name: Configurar Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Consultar API y Generar Reporte
      env:
        FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
        GOOGLE_SHEETS_URL: ${{ secrets.GOOGLE_SHEETS_URL }}
      run: python vuelos.py

    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # Agregamos tanto el README principal como la carpeta historial
        git add README.md historial/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización e historial automático de vuelos" && git push)
